<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tracking | Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- Herkesin sayfasında aynı olacak menü. Bookbox'a tıklayınca ana sayfaya döner -->
    <nav class="page-select">
        <a class="logo" href="index.html">Bookbox</a>
        <a class="pages" href="library.html">Kitaplığım</a>
        <a class="pages" href="details.html">Kitap Detayı</a>
        <a class="pages" href="add-book.html">Kitap Ekle</a>
        <a class="pages" href="history.html">Okuma Geçmişi</a>
    </nav>

    <!-- Kitap rafı görseli -->
    <div class="kapak-alani">
        <img class="kapak-resmi" src="kitap-rafi.jpg" alt="Kitap rafı">
        <div class="kapak-yazi">
            <h1>Welcome to BOOKBOX</h1>
            <p>Okuduğun kitapları takip et, puanla ve yenilerini keşfet.</p>
        </div>
    </div>

    <!-- Bu haftanın üst rafları: 2 raf x 5 kitap, puanı en yüksek 10 kitap books.js'ten gelir -->
    <div class="bolum">
        <h2>Bu Haftanın Üst Rafları</h2>

        <div class="raf" id="raf1"></div>
        <div class="raf-tahta"></div>
        <div class="etiketler" id="etiket1"></div>

        <div class="raf" id="raf2"></div>
        <div class="raf-tahta"></div>
        <div class="etiketler" id="etiket2"></div>
    </div>

    <div class="alt-bilgi">Bookbox &copy; 2026</div>

    <!-- Ortak kitap listesi -->
    <script src="books.js"></script>
    <script src="reviews.js"></script>
    <script src="ortak.js"></script>
    <script>
        // Kitapları puana göre büyükten küçüğe sırala.
        // slice() kopya alır, böylece books dizisinin kendi sırası bozulmaz.
        // Puanı eşit olan kitaplar books.js'teki sırayla kalır.
        let sirali = books.slice().sort(function (a, b) {
            return b.rating - a.rating;
        });

        let raf1 = "", raf2 = "";
        let etiket1 = "", etiket2 = "";

        // Rafta 10 yer var: ilk 5'i üst rafa, sonraki 5'i alt rafa
        for (let i = 0; i < 10; i++) {
            let kitapHtml;
            let etiketHtml;

            if (i < sirali.length) {
                let kitap = sirali[i];

                // Kapak resmi varsa resmi, yoksa adının yazdığı kahverengi kapağı göster
                let kapak;
                if (kitap.cover != "") {
                    kapak = '<img class="kitap-kapak" src="' + kitap.cover + '" alt="' + kitap.title + '">';
                } else {
                    kapak = '<div class="bos-kapak">' + kitap.title + '</div>';
                }

                kitapHtml =
                    '<a class="kitap" href="details.html?id=' + kitap.id + '">' +
                        kapak +
                        '<div class="kitap-ozet">' + kitap.summary + '</div>' +
                    '</a>';

                etiketHtml =
                    '<div class="etiket">' +
                        '<p class="kitap-ad">' + kitap.title + '</p>' +
                        '<p class="kitap-yazar">' + kitap.author + '</p>' +
                    '</div>';
            } else {
                // bu sırada kitap yoksa boş yer göster
                kitapHtml = '<div class="bos-yer">Boş raf yeri</div>';
                etiketHtml = '<div class="etiket"></div>';
            }

            if (i < 5) {
                raf1 = raf1 + kitapHtml;
                etiket1 = etiket1 + etiketHtml;
            } else {
                raf2 = raf2 + kitapHtml;
                etiket2 = etiket2 + etiketHtml;
            }
        }

        document.getElementById("raf1").innerHTML = raf1;
        document.getElementById("etiket1").innerHTML = etiket1;
        document.getElementById("raf2").innerHTML = raf2;
        document.getElementById("etiket2").innerHTML = etiket2;
    </script>
</body>
</html>

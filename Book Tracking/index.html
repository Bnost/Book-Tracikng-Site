<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tracking | Home</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Sadece ana sayfaya özel stiller. Ortak stiller style.css içinde. */

        /* BU HAFTANIN ÜST RAFLARI */
        /* Bir raf: kitaplar yan yana dizilir, altlarında kahverengi tahta durur */
        .raf{
            display: flex;
            justify-content: space-around;
            align-items: flex-end;     /* kitaplar rafın tabanına otursun */
            padding: 20px 10px 0 10px;
        }
        .raf-tahta{
            height: 18px;
            background-color: saddlebrown;
            border-bottom: 6px solid #5a2d0c;   /* tahtanın kalın ön kenarı */
            border-radius: 3px;
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.4);
        }

        /* Raftaki tek kitap */
        .kitap{
            position: relative;    /* özet kutusu kitaba göre konumlansın */
            width: 16%;
            aspect-ratio: 2 / 3;   /* kitap kapağı oranı */
            display: block;
            text-decoration: none;
        }
        .kitap-kapak{
            display: block;   /* kapağın altında boşluk kalmasın */
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 2px 6px 6px 2px;
            box-shadow: 4px 0 6px rgba(0, 0, 0, 0.4);
        }
        /* Üstüne gelince çıkan özet: absolute ile kapağın üstüne biner */
        .kitap-ozet{
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            box-sizing: border-box;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.85);
            color: white;
            font-size: 13px;
            border-radius: 2px 6px 6px 2px;
            display: none;
        }
        .kitap:hover .kitap-ozet{
            display: block;
        }
        .kitap:hover{
            transform: translateY(-8px);   /* raftan biraz kalkar */
        }

        /* Rafta henüz kitap olmayan yer */
        .bos-yer{
            width: 16%;
            aspect-ratio: 2 / 3;
            box-sizing: border-box;
            border: 2px dashed #5a2d0c;
            border-radius: 6px;
            color: #5a2d0c;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 14px;
        }

        /* Rafın altındaki ad / yazar yazıları (kitaplarla aynı hizada) */
        .etiketler{
            display: flex;
            justify-content: space-around;
            padding: 12px 10px 30px 10px;
        }
        .etiket{
            width: 16%;
            text-align: center;
        }
        .kitap-ad{
            font-weight: bold;
            margin: 0;
        }
        .kitap-yazar{
            color: #5a2d0c;
            font-size: 14px;
            margin: 4px 0 0 0;
        }

        /* Küçük ekranda raftaki yazılar küçülür */
        @media (max-width: 900px) {
            .bos-kapak{
                font-size: 11px;
                padding: 4px;
            }
            .kitap-ozet{
                font-size: 10px;
            }
            .kitap-ad, .kitap-yazar{
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <!-- Herkesin sayfasında aynı olacak menü. Bookbox'a tıklayınca ana sayfaya döner -->
    <nav class="page-select">
        <a class="logo" href="index.html">Bookbox</a>
        <a class="pages" href="library.html">Kitaplığım</a>
        <a class="pages" href="details.html">Kitap Detayı</a>
        <a class="pages" href="add-book.html">Kitap Ekle</a>
        <a class="pages" href="history.html">Okuma Geçmişi</a>
    </nav>

    <!-- Kitap rafı görseli -->
    <div class="kapak-alani">
        <img class="kapak-resmi" src="kitap-rafi.jpg" alt="Kitap rafı">
        <div class="kapak-yazi">
            <h1>Welcome to CU BOOK PROJECT</h1>
            <p>Okuduğun kitapları takip et, puanla ve yenilerini keşfet.</p>
        </div>
    </div>

    <!-- Bu haftanın üst rafları: 2 raf x 5 kitap, kitaplar books.js'ten gelir -->
    <div class="bolum">
        <h2>Bu Haftanın Üst Rafları</h2>

        <div class="raf" id="raf1"></div>
        <div class="raf-tahta"></div>
        <div class="etiketler" id="etiket1"></div>

        <div class="raf" id="raf2"></div>
        <div class="raf-tahta"></div>
        <div class="etiketler" id="etiket2"></div>
    </div>

    <div class="alt-bilgi">Bookbox &copy; 2026</div>

    <!-- Ortak kitap listesi -->
    <script src="books.js"></script>
    <script>
        let raf1 = "", raf2 = "";
        let etiket1 = "", etiket2 = "";

        // Rafta 10 yer var: ilk 5'i üst rafa, sonraki 5'i alt rafa
        for (let i = 0; i < 10; i++) {
            let kitapHtml;
            let etiketHtml;

            if (i < books.length) {
                let kitap = books[i];

                // Kapak resmi varsa resmi, yoksa adının yazdığı kahverengi kapağı göster
                let kapak;
                if (kitap.cover != "") {
                    kapak = '<img class="kitap-kapak" src="' + kitap.cover + '" alt="' + kitap.title + '">';
                } else {
                    kapak = '<div class="bos-kapak">' + kitap.title + '</div>';
                }

                kitapHtml =
                    '<a class="kitap" href="details.html?id=' + kitap.id + '">' +
                        kapak +
                        '<div class="kitap-ozet">' + kitap.summary + '</div>' +
                    '</a>';

                etiketHtml =
                    '<div class="etiket">' +
                        '<p class="kitap-ad">' + kitap.title + '</p>' +
                        '<p class="kitap-yazar">' + kitap.author + '</p>' +
                    '</div>';
            } else {
                // books.js'te bu sırada kitap yoksa boş yer göster
                kitapHtml = '<div class="bos-yer">Boş raf yeri</div>';
                etiketHtml = '<div class="etiket"></div>';
            }

            if (i < 5) {
                raf1 = raf1 + kitapHtml;
                etiket1 = etiket1 + etiketHtml;
            } else {
                raf2 = raf2 + kitapHtml;
                etiket2 = etiket2 + etiketHtml;
            }
        }

        document.getElementById("raf1").innerHTML = raf1;
        document.getElementById("etiket1").innerHTML = etiket1;
        document.getElementById("raf2").innerHTML = raf2;
        document.getElementById("etiket2").innerHTML = etiket2;
    </script>
</body>
</html>
